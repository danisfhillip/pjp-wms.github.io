<body>
<script>
window.headerTitle='Manage User';
</script>
<?!= include('header'); ?>

<div class="container">
  <div class="manage-card">
    <div class="manage-top">
      <div class="header-title">
        <h1>Manage User</h1>
        <p>Kelola akun dan akses pengguna</p>
      </div>
      <button class="add-button" onclick="openAdd()">+ Tambah User</button>
    </div>

    <div class="toolbar">
      <input class="search" id="search" placeholder="🔍  Cari ID user..." oninput="renderUsers()">
      <div class="user-count" id="userCount">0 user</div>
    </div>
  </div>

  <div id="message"></div>

  <div class="table-box">
    <div id="userList" class="loading">Memuat user...</div>
  </div>
</div>

<div id="modal">
  <div class="modal-card">
    <div class="modal-title" id="modalTitle">Tambah User</div>
    <div class="field">
      <div class="label">ID USER</div>
      <input class="input" id="userId" placeholder="Contoh: PJP.Operator">
    </div>
    <div class="field" id="pinField">
      <div class="label">PIN</div>
      <input class="input" id="userPin" type="password" inputmode="numeric" placeholder="Minimal 4 digit">
    </div>
    <div class="field">
      <div class="label">PERMISSION</div>
      <div class="permissions-grid" id="permissions"></div>
    </div>
    <div class="modal-actions">
      <button class="cancel" onclick="closeModal()">BATAL</button>
      <button class="save" onclick="saveUser()">SIMPAN</button>
    </div>
  </div>
</div>

<script>
let users=[];
let editMode=false;
const permissionList=['Dashboard','Stock','Opname','Movement','Sample Cut','Receiving','Outbound','Barcode','Location','Admin'];

function getToken(){
  return localStorage.getItem('warehouseToken');
}

function showMessage(message,type){
  const box=document.getElementById('message');
  box.textContent=message;
  box.className=type||'error';
}

function loadUsers(){
  document.getElementById('userList').innerHTML='<div class="loading">Memuat user...</div>';
  google.script.run
    .withSuccessHandler(function(result){
      if(!result.success){
        showMessage(result.message,'error');
        document.getElementById('userList').innerHTML='';
        return;
      }
      users=result.users||[];
      renderUsers();
    })
    .withFailureHandler(function(error){
      showMessage('Terjadi error: '+error.message,'error');
      document.getElementById('userList').innerHTML='';
    })
    .getUsers(getToken());
}

function renderUsers(){
  const box=document.getElementById('userList');
  const search=document.getElementById('search').value.trim().toLowerCase();
  const filtered=users.filter(function(user){
    return user.userId.toLowerCase().includes(search);
  });
  document.getElementById('userCount').textContent=filtered.length+' user';
  if(!filtered.length){
    box.innerHTML='<div class="empty">User tidak ditemukan.</div>';
    return;
  }
  const rows=filtered.map(function(user){
    return '<tr>'+
      '<td><div class="user-id">'+escapeHtml(user.userId)+'</div></td>'+
      '<td><span class="pin">'+(user.hasPin?'● Aktif':'○ Belum')+'</span></td>'+
      '<td>'+statusCell(user)+'</td>'+
      permissionCell(user,'Dashboard')+
      permissionCell(user,'Stock')+
      permissionCell(user,'Opname')+
      permissionCell(user,'Movement')+
      permissionCell(user,'Sample Cut')+
      permissionCell(user,'Receiving')+
      permissionCell(user,'Outbound')+
      permissionCell(user,'Barcode')+
      permissionCell(user,'Location')+
      permissionCell(user,'Admin')+
      '<td><div class="actions">'+
        '<button class="action edit" onclick="openEdit(\''+escapeJs(user.userId)+'\')">Edit</button>'+
        '<button class="action reset" onclick="resetPin(\''+escapeJs(user.userId)+'\')">Reset</button>'+
        '<button class="action '+(String(user.status||'Aktif').toLowerCase()==='aktif'?'delete':'edit')+'" onclick="toggleUserStatus(\''+escapeJs(user.userId)+'\',\''+(String(user.status||'Aktif').toLowerCase()==='aktif'?'Nonaktif':'Aktif')+'\')">'+(String(user.status||'Aktif').toLowerCase()==='aktif'?'Nonaktifkan':'Aktifkan')+'</button>'+
      '</div></td>'+
    '</tr>';
  }).join('');
  box.innerHTML='<table>'+
    '<thead><tr>'+
      '<th>ID User</th><th>PIN</th><th>Status</th><th>Dashboard</th><th>Stock</th><th>Opname</th><th>Movement</th><th>Sample Cut</th><th>Receiving</th><th>Outbound</th><th>Barcode</th><th>Location</th><th>Admin</th><th>Aksi</th>'+
    '</tr></thead>'+
    '<tbody>'+rows+'</tbody>'+
  '</table>';
}

function permissionCell(user,name){
  const active=user.permissions[name]===true;
  const cls=name==='Admin'&&active?'yes admin':active?'yes':'no';
  return '<td><span class="'+cls+'">'+(active?'✓':'—')+'</span></td>';
}

function statusCell(user){
  const active=String(user.status||'Aktif').toLowerCase()==='aktif';
  return '<span class="'+(active?'status-active':'status-disabled')+'">'+(active?'Aktif':'Nonaktif')+'</span>';
}

function openAdd(){
  editMode=false;
  document.getElementById('modalTitle').textContent='Tambah User';
  document.getElementById('userId').value='';
  document.getElementById('userId').disabled=false;
  document.getElementById('userPin').value='';
  document.getElementById('pinField').style.display='block';
  renderPermissions({});
  document.getElementById('modal').style.display='flex';
}

function openEdit(userId){
  const user=users.find(function(item){return item.userId===userId;});
  if(!user)return;
  editMode=true;
  document.getElementById('modalTitle').textContent='Edit User';
  document.getElementById('userId').value=user.userId;
  document.getElementById('userId').disabled=true;
  document.getElementById('userPin').value='';
  document.getElementById('pinField').style.display='none';
  renderPermissions(user.permissions);
  document.getElementById('modal').style.display='flex';
}

function renderPermissions(current){
  document.getElementById('permissions').innerHTML=permissionList.map(function(p){
    return '<label class="check"><input type="checkbox" data-permission="'+p+'" '+(current[p]===true?'checked':'')+'> '+p+'</label>';
  }).join('');
}

function getPermissions(){
  const permissions={};
  document.querySelectorAll('#permissions input[data-permission]').forEach(function(input){
    permissions[input.getAttribute('data-permission')]=input.checked;
  });
  return permissions;
}

function saveUser(){
  const userId=document.getElementById('userId').value.trim();
  const pin=document.getElementById('userPin').value.trim();
  const permissions=getPermissions();
  if(!userId){alert('ID wajib diisi.');return;}
  if(!editMode&&!pin){alert('PIN wajib diisi.');return;}
  const callback=function(result){
    if(!result.success){alert(result.message);return;}
    closeModal();
    showMessage(result.message,'success');
    loadUsers();
  };
  if(editMode){
    google.script.run.withSuccessHandler(callback).withFailureHandler(function(error){
      alert(error.message);
    }).updateUser(getToken(),userId,permissions);
  }else{
    google.script.run.withSuccessHandler(callback).withFailureHandler(function(error){
      alert(error.message);
    }).addUser(getToken(),userId,pin,permissions);
  }
}

function resetPin(userId){
  const pin=prompt('Masukkan PIN baru untuk '+userId+':');
  if(pin===null)return;
  if(String(pin).length<4){
    alert('PIN minimal 4 digit.');
    return;
  }
  google.script.run.withSuccessHandler(function(result){
    if(!result.success){alert(result.message);return;}
    showMessage(result.message,'success');
    loadUsers();
  }).withFailureHandler(function(error){
    alert(error.message);
  }).resetUserPin(getToken(),userId,pin);
}

function toggleUserStatus(userId,status){
  const action=status==='Aktif'?'mengaktifkan':'menonaktifkan';
  if(!confirm('Yakin ingin '+action+' user "'+userId+'"?'))return;
  google.script.run.withSuccessHandler(function(result){
    if(!result.success){alert(result.message);return;}
    showMessage(result.message,'success');
    loadUsers();
  }).withFailureHandler(function(error){
    alert(error.message);
  }).setUserStatus(getToken(),userId,status);
}

function closeModal(){
  document.getElementById('modal').style.display='none';
}

//     window.top.location.href=url+'?page=home&_='+Date.now();
//   }).getWebAppUrl();
// }

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g,function(char){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char];
  });
}

function escapeJs(value){
  return String(value).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}

loadUsers();
</script>
</body>
</html>
