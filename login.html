<div id="loginOverlay">
  <div class="login-card">
    <div class="login-logo">🏭</div>
    <h1>WAREHOUSE SYSTEM</h1>
    <div class="login-subtitle">Silakan login untuk melanjutkan</div>
    <div class="input-group">
      <div class="login-label">ID</div>
      <input class="login-input" type="text" id="loginId" placeholder="ID operator" autocomplete="username">
    </div>
    <div class="input-group">
      <div class="login-label">PIN</div>
      <div class="pin-wrap">
        <input class="login-input" type="password" id="loginPin" placeholder="PIN" inputmode="numeric" autocomplete="current-password">
        <button type="button" class="pin-toggle" onclick="togglePin()">
          <svg class="eye-icon" viewBox="0 0 24 24" fill="none">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" stroke="currentColor" stroke-width="2"/>
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
          </svg>
        </button>
      </div>
    </div>
    <div id="loginMessage"></div>
    <button class="login-button" id="loginButton" onclick="login()">LOGIN</button>
  </div>
</div>

<style>
#loginOverlay{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:20px;background:#f5f5f5;font-family:Arial,sans-serif;box-sizing:border-box}
#loginOverlay *{box-sizing:border-box}
#loginOverlay .login-card{width:100%;max-width:380px;background:#fff;border-radius:16px;padding:28px;box-shadow:0 4px 20px rgba(0,0,0,.1)}
#loginOverlay .login-logo{text-align:center;font-size:42px;line-height:1;margin-bottom:12px}
#loginOverlay .login-card h1{text-align:center;font-family:Arial,sans-serif;font-size:22px;font-weight:700;line-height:1.2;margin:0 0 5px;color:#222}
#loginOverlay .login-subtitle{text-align:center;color:#888;font-size:13px;line-height:1.4;margin-bottom:25px}
#loginOverlay .input-group{margin-bottom:15px}
#loginOverlay .login-label{display:block;font-family:Arial,sans-serif;font-size:13px;font-weight:700;line-height:1.3;margin-bottom:6px;color:#222}
#loginOverlay .login-input{display:block;width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;background:#fff;color:#222;font-family:Arial,sans-serif;font-size:15px;line-height:1.4;outline:none}
#loginOverlay .login-input:focus{border-color:#AD2020}
#loginOverlay .pin-wrap{position:relative}
#loginOverlay .pin-wrap .login-input{padding-right:45px}
#loginOverlay .pin-toggle{position:absolute;right:0;top:0;width:45px;height:100%;border:0;background:none;color:#888;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
#loginOverlay .eye-icon{width:21px;height:21px}
#loginOverlay .login-button{display:block;width:100%;border:0;border-radius:8px;padding:13px;background:#AD2020;color:#fff;font-family:Arial,sans-serif;font-size:15px;font-weight:700;line-height:1.3;cursor:pointer;margin-top:5px}
#loginOverlay .login-button:disabled{opacity:.6;cursor:not-allowed}
#loginOverlay #loginMessage{display:none;margin-bottom:15px;padding:11px;border-radius:8px;font-family:Arial,sans-serif;font-size:13px;line-height:1.4}
#loginOverlay #loginMessage.error{display:block;background:#fdeaea;color:#a02020}
#loginOverlay #loginMessage.success{display:block;background:#e8f7e8;color:#216b21}
</style>

<script>
// window.webAppUrl=__WEB_APP_URL__;

function showLoginMessage(message,type){
  const box=document.getElementById('loginMessage');
  box.textContent=message;
  box.className=type||'error';
}

function togglePin(){
  const input=document.getElementById('loginPin');
  const button=document.querySelector('.pin-toggle');
  if(input.type==='password'){
    input.type='text';
    button.innerHTML='<svg class="eye-icon" viewBox="0 0 24 24" fill="none"><path d="M3 3l18 18" stroke="currentColor" stroke-width="2"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" stroke="currentColor" stroke-width="2"/><path d="M9.9 5.2A9.7 9.7 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-3.2 3.8" stroke="currentColor" stroke-width="2"/><path d="M6.1 6.1C3.5 8.1 2 12 2 12s3.5 7 10 7c1.3 0 2.5-.3 3.6-.7" stroke="currentColor" stroke-width="2"/></svg>';
  }else{
    input.type='password';
    button.innerHTML='<svg class="eye-icon" viewBox="0 0 24 24" fill="none"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/></svg>';
  }
}

function login(){
  const userId=document.getElementById('loginId').value.trim();
  const pin=document.getElementById('loginPin').value.trim();
  const button=document.getElementById('loginButton');

  if(!userId){showLoginMessage('ID wajib diisi.','error');return;}
  if(!pin){showLoginMessage('PIN wajib diisi.','error');return;}

  button.disabled=true;
  button.textContent='LOGIN...';
  document.getElementById('loginMessage').className='';

  google.script.run
    .withSuccessHandler(function(response){
      if(!response.success){
        button.disabled=false;
        button.textContent='LOGIN';
        showLoginMessage(response.message,'error');
        return;
      }

      localStorage.setItem('warehouseToken',response.token);
      localStorage.setItem('warehouseUserId',response.userId);
      localStorage.setItem('warehousePermissions',JSON.stringify(response.permissions));

      const url=localStorage.getItem('warehouseWebAppUrl');

      if(url){
        window.top.location.href=url+'?page=home';
        return;
      }

      google.script.run
        .withSuccessHandler(function(url){
          localStorage.setItem('warehouseWebAppUrl',url);
          window.top.location.href=url+'?page=home';
        })
        .withFailureHandler(function(){
          button.disabled=false;
          button.textContent='LOGIN';
          showLoginMessage('Gagal membuka halaman utama. Silakan coba lagi.','error');
        })
        .getWebAppUrl();
    })
    .withFailureHandler(function(error){
      button.disabled=false;
      button.textContent='LOGIN';
      showLoginMessage('Terjadi error: '+error.message,'error');
    })
    .loginUser(userId,pin);
}

function checkLogin(){
  const token=localStorage.getItem('warehouseToken');

  if(!token){
    document.getElementById('loginOverlay').style.display='flex';
    return;
  }

  google.script.run
    .withSuccessHandler(function(result){
      if(!result.success){
        localStorage.removeItem('warehouseToken');
        localStorage.removeItem('warehouseUserId');
        localStorage.removeItem('warehousePermissions');
        document.getElementById('loginOverlay').style.display='flex';

        if(result.reason==='SESSION_EXPIRED'){
          showLoginMessage('Session telah berakhir. Silakan login kembali.','error');
        }

        return;
      }

      localStorage.setItem('warehouseUserId',result.userId);
      localStorage.setItem('warehousePermissions',JSON.stringify(result.permissions));
      document.getElementById('loginOverlay').style.display='none';
      applyPermissions(result.permissions);
    })
    .withFailureHandler(function(){
      document.getElementById('loginOverlay').style.display='flex';
    })
    .getLoginSession(token);
}

function showDisabledAccount(){
  const overlay=document.getElementById('loginOverlay');
  const card=overlay.querySelector('.login-card');
  card.innerHTML='<div class="login-logo">🚫</div><h1>Akun Dinonaktifkan</h1><div class="login-subtitle" style="line-height:1.6">Akun Anda telah dinonaktifkan oleh Admin.<br>Anda tidak punya akses lagi ke Warehouse Management System Padajaya Pelita.</div><button class="login-button" onclick="window.location.reload()">KEMBALI KE LOGIN</button>';
  overlay.style.display='flex';
}

function checkSessionStatus(){

  const token=localStorage.getItem('warehouseToken');

  if(!token)return;

  google.script.run
    .withSuccessHandler(function(result){

      if(result.success)return;

      localStorage.removeItem('warehouseToken');
      localStorage.removeItem('warehouseUserId');
      localStorage.removeItem('warehousePermissions');

      if(result.reason==='USER_DISABLED'){

        showDisabledAccount();

      }else{

        document.getElementById('loginOverlay').style.display='flex';

        if(result.reason==='SESSION_EXPIRED'){

          showLoginMessage(
            'Session telah berakhir. Silakan login kembali.',
            'error'
          );

        }

      }

    })
    .withFailureHandler(function(){

      // Jangan menghapus session hanya karena
      // koneksi/server sedang bermasalah.

    })
    .getLoginSession(token);
}

setInterval(checkSessionStatus,60000);

document.addEventListener('visibilitychange',function(){

  if(document.visibilityState==='visible'){
    checkSessionStatus();
  }

});

document.getElementById('loginPin').addEventListener('keydown',function(e){
  if(e.key==='Enter')login();
});
document.getElementById('loginId').addEventListener('keydown',function(e){
  if(e.key==='Enter')login();
});

checkLogin();
</script>
