<script>
const locationStockCache={};
const rackStockLoading={};
const rackStockCallbacks={};
const locationViewModes={};

let rackDatabase=[];
let editingRack=null;

function loadRacks(){
  document.getElementById('rackList').innerHTML='<div class="empty">Memuat data rack...</div>';

  google.script.run
    .withSuccessHandler(function(response){
      if(!response||!response.success){
        showMessage(response&&response.message?response.message:'Gagal memuat rack.','error');
        return;
      }

      rackDatabase=response.racks||[];
      renderRacks();
    })
    .withFailureHandler(function(error){
      showMessage('Terjadi error: '+error.message,'error');
    })
    .getRackMaster();
}


function renderRacks(){
  const keyword=document.getElementById('searchRack').value.trim().toLowerCase();
  const list=document.getElementById('rackList');

  const filtered=rackDatabase.filter(function(item){
    return item.rack.toLowerCase().includes(keyword);
  });

  document.getElementById('rackCount').textContent=filtered.length+' Rack';

  if(!filtered.length){
    list.innerHTML='<div class="empty">Rack tidak ditemukan.</div>';
    return;
  }

  list.innerHTML='';
  list.className='rack-dashboard';

  filtered.forEach(function(item){
    const panel=document.createElement('div');
    panel.className='rack-panel';
    panel.dataset.rack=item.rack;

    const header=document.createElement('div');
    header.className='rack-panel-header';

    const arrow=document.createElement('div');
    arrow.className='rack-collapse-icon';
    arrow.textContent='›';

    const info=document.createElement('div');
    info.className='rack-panel-info';
    info.innerHTML=
      '<div class="rack-panel-name">'+escapeHtml(item.rack)+'</div>'+
      '<div class="rack-panel-meta">Posisi '+
      escapeHtml(item.startPosition)+'–'+escapeHtml(item.endPosition)+
      ' · '+item.levels.length+' level · '+item.totalLocation+' location</div>';

    const actions=document.createElement('div');
    actions.className='rack-panel-actions';

    const edit=document.createElement('button');
    edit.className='btn btn-edit';
    edit.textContent='EDIT';
    edit.onclick=function(event){
      event.stopPropagation();
      openEditRack(item.rack);
    };

    const qr=document.createElement('button');
    qr.className='btn btn-primary';
    qr.textContent='🖨 QR RACK';
    qr.onclick=function(event){
      event.stopPropagation();
      printRackQR(item);
    };

    actions.appendChild(edit);
    actions.appendChild(qr);

    header.appendChild(arrow);
    header.appendChild(info);
    header.appendChild(actions);

    const body=document.createElement('div');
    body.className='rack-panel-body';

    const mapContainer=document.createElement('div');
    mapContainer.className='rack-inline-map-container';
    mapContainer.id='rackInlineMap-'+rackKey(item.rack);

    const detail=document.createElement('div');
    detail.className='rack-inline-detail';
    detail.id='rackInlineDetail-'+rackKey(item.rack);

    body.appendChild(mapContainer);
    body.appendChild(detail);

    header.onclick=function(){
      const expanded=panel.classList.toggle('expanded');
      arrow.textContent=expanded?'⌄':'›';

      if(expanded&&!mapContainer.dataset.rendered){
        renderRackInline(item,mapContainer,detail);
        mapContainer.dataset.rendered='1';
        loadRackStockInline(item.rack);
      }
    };

    panel.appendChild(header);
    panel.appendChild(body);
    list.appendChild(panel);
  });
}

function rackKey(rack){
  return String(rack).replace(/[^a-zA-Z0-9_-]/g,'_');
}


function renderRackInline(item,container,detail){
  container.innerHTML='';

  const section=document.createElement('div');
  section.className='rack-map-section';

  const title=document.createElement('div');
  title.className='rack-map-title';
  title.textContent='Peta Kapasitas Rack';
  section.appendChild(title);

  const legend=document.createElement('div');
  legend.className='rack-map-legend';

  [
    ['Kosong','#d9f2df'],
    ['Tersedia','#fff1b8'],
    ['Hampir Penuh','#ffd9c2'],
    ['Penuh','#f5b8b8']
  ].forEach(function(entry){
    const wrapper=document.createElement('div');
    wrapper.className='rack-legend-item';

    const color=document.createElement('span');
    color.className='rack-legend-color';
    color.style.background=entry[1];

    const label=document.createElement('span');
    label.textContent=entry[0];

    wrapper.appendChild(color);
    wrapper.appendChild(label);
    legend.appendChild(wrapper);
  });

  section.appendChild(legend);

  const scroll=document.createElement('div');
  scroll.className='rack-map-scroll';

  const grid=document.createElement('div');
  grid.className='rack-inline-map';
  grid.style.gridTemplateColumns='38px repeat('+item.positions.length+',66px)';

  const positions=item.positions.slice().sort(function(a,b){
    return Number(b)-Number(a);
  });

  const levels=item.levels.slice().sort().reverse();

  const corner=document.createElement('div');
  corner.className='rack-map-label';
  corner.textContent='LVL';
  grid.appendChild(corner);

  positions.forEach(function(position){
    const label=document.createElement('div');
    label.className='rack-map-label';
    label.textContent=String(position).padStart(2,'0');
    grid.appendChild(label);
  });

  levels.forEach(function(level){
    const levelLabel=document.createElement('div');
    levelLabel.className='rack-map-level';
    levelLabel.textContent=level;
    grid.appendChild(levelLabel);

    positions.forEach(function(position){
      const positionText=String(position).padStart(2,'0');
      const locationId=item.rack+' '+positionText+'-'+level;
      const location=(item.locations||[]).find(function(entry){
        return entry.id===locationId;
      });

      const status=location&&location.status?location.status:'Kosong';
      const cell=document.createElement('button');
      cell.type='button';
      cell.className='rack-location-cell '+getLocationStatusClass(status);
      cell.dataset.locationId=locationId;
      cell.title=locationId+' • '+status;

      const id=document.createElement('strong');
      id.textContent=positionText+'-'+level;

      const statusText=document.createElement('span');
      statusText.textContent=status;

function loadRackStockInline(rack){
  const item=rackDatabase.find(function(entry){
    return entry.rack===rack;
  });
  if(!item)return;

  const allCached=(item.locations||[]).length>0&&
    item.locations.every(function(location){
      return !!locationStockCache[location.id];
    });

  if(allCached){
    refreshRackMapInline(rack);
    return;
  }

  // Jika request sudah berjalan, jangan kirim request duplikat.
  if(rackStockLoading[rack]){
    rackStockCallbacks[rack]=true;
    return;
  }

  rackStockLoading[rack]=true;

  const token=localStorage.getItem('warehouseToken');

  google.script.run
    .withSuccessHandler(function(response){
      rackStockLoading[rack]=false;

      if(!response||!response.success){
        delete rackStockCallbacks[rack];
        showMessage(response&&response.message?response.message:'Gagal memuat stok rack.','error');
        return;
      }

      const fresh=response.locations||{};

      Object.keys(fresh).forEach(function(id){
        locationStockCache[id]=fresh[id];

        const location=(item.locations||[]).find(function(entry){
          return entry.id===id;
        });

        if(location){
          location.status=fresh[id].status||location.status||'Kosong';
        }
      });

      refreshRackMapInline(rack);

      const detail=document.getElementById('rackInlineDetail-'+rackKey(rack));
      const selected=document.querySelector(
        '#rackInlineMap-'+rackKey(rack)+' .rack-location-cell.selected'
      );

      if(detail&&selected){
        loadLocationDetailInline(selected.dataset.locationId,selected,detail);
      }

      delete rackStockCallbacks[rack];
    })
    .withFailureHandler(function(error){
      rackStockLoading[rack]=false;
      delete rackStockCallbacks[rack];
      showMessage('Gagal memuat stok rack: '+error.message,'error');
    })
    .getRackStockDetails(rack,token);
}

function refreshRackMapInline(rack){
  const item=rackDatabase.find(function(entry){
    return entry.rack===rack;
  });
  if(!item)return;

  const container=document.getElementById('rackInlineMap-'+rackKey(rack));
  const detail=document.getElementById('rackInlineDetail-'+rackKey(rack));
  if(!container||!detail)return;

  const selectedId=container.querySelector('.rack-location-cell.selected');
  const selectedLocation=selectedId?selectedId.dataset.locationId:null;

  renderRackInline(item,container,detail);
  container.dataset.rendered='1';

  if(selectedLocation){
    const cell=Array.from(container.querySelectorAll('.rack-location-cell'))
      .find(function(el){return el.dataset.locationId===selectedLocation;});

    if(cell){
      cell.classList.add('selected');
      if(locationStockCache[selectedLocation]){
        loadLocationDetailInline(selectedLocation,cell,detail);
      }
    }
  }
}


function loadLocationDetailInline(locationId,cell,detail){
  const cached=locationStockCache[locationId];

  if(cached){
    renderLocationDetailInline(cached,cell,detail);
    return;
  }

  detail.innerHTML='<div class="location-detail-panel">Memuat data lokasi...</div>';

  const rack=locationId.replace(/\s+\d{2}-[A-Z]$/,'');
  loadRackStockInline(rack);
}

function renderLocationRollList(data,container,mode){
  container.innerHTML='';

  const rolls=data.rolls||[];

  if(!rolls.length){
    const empty=document.createElement('div');
    empty.className='location-roll-empty';
    empty.textContent='Belum ada roll tercatat di lokasi ini.';
    container.appendChild(empty);
    return;
  }

  if(mode==='roll'){
    renderLocationRollTable(rolls,container);
    return;
  }

  const groups={};

  rolls.forEach(function(roll){
    const key=JSON.stringify([
      roll.category||'',
      roll.fabricType||'',
      roll.product||roll.sku||'',
      roll.color||'',
      roll.gsm||'',
      roll.width||''
    ]);

    if(!groups[key]){
      groups[key]={
        category:roll.category||'-',
        fabricType:roll.fabricType||'-',
        product:roll.product||roll.sku||'-',
        color:roll.color||'-',
        gsm:roll.gsm||'-',
        width:roll.width||'-',
        rollCount:0,
        totalMeter:0,
        totalYard:0,
        rolls:[]
      };
    }

    const group=groups[key];
    group.rollCount++;
    group.totalMeter+=Number(roll.meter)||0;
    group.totalYard+=Number(roll.yard)||0;
    group.rolls.push(roll);
  });

  const groupList=Object.values(groups);

  const summary=document.createElement('div');
  summary.style.cssText='font-size:12px;color:#777;margin-bottom:10px';
  summary.textContent=groupList.length+' grup produk · '+rolls.length+' roll';

    head.appendChild(th);
  });

  table.appendChild(thead);

  groupList.forEach(function(group){

    [
      group.product,
      group.color,
      group.gsm,
      group.width,
      group.rollCount,
      formatLocationNumber(group.totalMeter),
      formatLocationNumber(group.totalYard)
    ].forEach(function(value){
      const td=document.createElement('td');
      td.textContent=value===null||value===undefined||value===''?'-':String(value);
      row.appendChild(td);

function renderRackQR(item){
  const positions=item.positions.slice().sort(function(a,b){
    return Number(a)-Number(b);
  });

  const levels=item.levels.slice().sort();

  const positionCount=positions.length;

  let rowHeight=25;
  let qrSize=18;

  if(positionCount<=5){
    rowHeight=30;
    qrSize=22;
  }else if(positionCount<=6){
    rowHeight=27;
    qrSize=20;
  }else if(positionCount<=8){
    rowHeight=22;
    qrSize=17;
  }else if(positionCount<=10){
    rowHeight=18;
    qrSize=14;
  }else{
    rowHeight=15;
    qrSize=12;
  }

  let html=
    '<div class="rack-a5-preview">'+
      '<div class="rack-a5-header">'+
        '<div class="rack-a5-company">PADAJAYA PELITA</div>'+
        '<div class="rack-a5-title">LOCATION MAP</div>'+
        '<div class="rack-a5-name">'+escapeHtml(item.rack)+'</div>'+
        '<div class="rack-a5-subtitle">Scan QR sesuai posisi penyimpanan</div>'+
      '</div>'+
      '<div class="rack-a5-grid" style="grid-template-columns:12mm repeat('+levels.length+',1fr)">'+
        '<div class="rack-a5-cell rack-a5-header-cell">POS</div>';

  levels.forEach(function(level){
    html+=
      '<div class="rack-a5-cell rack-a5-header-cell">'+
        escapeHtml(level)+
      '</div>';
  });

  positions.forEach(function(position){
    html+=
      '<div class="rack-a5-cell rack-a5-position" style="height:'+rowHeight+'mm">'+
        escapeHtml(position)+
      '</div>';

    levels.forEach(function(level){
      const locationId=item.rack+' '+position+'-'+level;
      const qrId='rackqr-'+
        String(position).replace(/[^a-zA-Z0-9]/g,'')+
        '-'+level;

      html+=
        '<div class="rack-a5-cell rack-a5-qr" style="height:'+rowHeight+'mm">'+
          '<div class="rack-a5-qr-box" id="'+qrId+'" style="width:'+qrSize+'mm;height:'+qrSize+'mm"></div>'+
          '<div class="rack-a5-location">'+
            escapeHtml(locationId)+
          '</div>'+
        '</div>';
    });
  });

  html+=
      '</div>'+
      '<div class="rack-a5-footer">PADAJAYA PELITA • LOCATION QR MAP</div>'+
    '</div>';

  document.getElementById('rackQRPreview').innerHTML=html;

  positions.forEach(function(position){
    levels.forEach(function(level){
      const locationId=item.rack+' '+position+'-'+level;

      const qrId='rackqr-'+
        String(position).replace(/[^a-zA-Z0-9]/g,'')+
        '-'+level;

      const qr=document.getElementById(qrId);

      if(qr){
        new QRCode(qr,{
          text:locationId,
          width:220,
          height:220,
          correctLevel:QRCode.CorrectLevel.M
        });
      }
    });
  });
}

function updatePreview(){
  const rack=document.getElementById('rackName').value.trim();
  const start=Number(document.getElementById('startPosition').value);
  const end=Number(document.getElementById('endPosition').value);
  const levels=[...document.querySelectorAll('.level-check:checked')].map(function(item){return item.value;});
  const preview=document.getElementById('previewLocation');

  if(!rack||!start||!end||end<start||!levels.length){
    preview.textContent='-';
    return;
  }

  const result=[];

  for(let pos=start;pos<=end;pos++){
    const position=String(pos).padStart(2,'0');

    levels.forEach(function(level){
      result.push(rack+' '+position+'-'+level);
    });
  }

  preview.innerHTML=result.map(function(item){
    return '<div>'+escapeHtml(item)+'</div>';
  }).join('');
}

function saveRack(){
  const rack=document.getElementById('rackName').value.trim();
  const start=Number(document.getElementById('startPosition').value);
  const end=Number(document.getElementById('endPosition').value);
  const levels=[...document.querySelectorAll('.level-check:checked')].map(function(item){return item.value;});
  const token=localStorage.getItem('warehouseToken');
  const button=document.getElementById('saveRackButton');

  if(!rack){
    showMessage('Nama Rack harus diisi.','error');
    return;
  }

  if(!Number.isInteger(start)||!Number.isInteger(end)||start!==1||end<1){
    showMessage('Posisi harus dimulai dari 01.','error');
    return;
  }

  if(!levels.length){
    showMessage('Minimal pilih satu level.','error');
    return;
  }

  button.disabled=true;
  button.textContent='MENYIMPAN...';

  if(editingRack){
    google.script.run
      .withSuccessHandler(function(response){
        button.disabled=false;
        button.textContent='SIMPAN';

        if(!response.success){
          if(response.blockedLocations&&response.blockedLocations.length){
            showMessage(
              'Tidak bisa dikurangi. Location yang sedang digunakan: '+
              response.blockedLocations.join(', '),
              'error'
            );
          }else{
            showMessage(response.message||'Gagal mengubah Rack.','error');
          }
          return;
        }

        closeRackModal();

        showMessage(
          'Rack berhasil diperbarui. '+
          response.added.length+' location ditambahkan, '+
          response.deleted.length+' location dihapus.',
          'success'
        );

        loadRacks();
      })
      .withFailureHandler(function(error){
        button.disabled=false;
        button.textContent='SIMPAN';
        showMessage('Terjadi error: '+error.message,'error');
      })
      .updateRackConfiguration(rack,end,levels,token);

  }else{
    google.script.run
      .withSuccessHandler(function(response){
        button.disabled=false;
        button.textContent='SIMPAN';

        if(!response.success){
          showMessage(response.message||'Gagal membuat Rack.','error');
          return;
        }

        closeRackModal();

        showMessage(
          'Rack berhasil dibuat. '+response.created.length+' location ditambahkan.',
          'success'
        );

        loadRacks();
      })
      .withFailureHandler(function(error){
        button.disabled=false;
        button.textContent='SIMPAN';
        showMessage('Terjadi error: '+error.message,'error');
      })
      .generateLocations(rack,start,end,levels,token);
  }
}

        });
        cell.classList.add('selected');
        loadLocationDetail(locationId,cell);
      };

      grid.appendChild(cell);
    });
  });

  scroll.appendChild(grid);
  section.appendChild(scroll);
  container.appendChild(section);

  const detailPanel=document.createElement('div');
  detailPanel.id='locationDetailPanel';
  container.appendChild(detailPanel);

  const qrSection=document.createElement('details');
  qrSection.className='qr-position-list';

  const qrSummary=document.createElement('summary');
  qrSummary.textContent='QR per Posisi';
  qrSection.appendChild(qrSummary);

  const qrButtons=document.createElement('div');
  qrButtons.className='qr-position-buttons';

  item.positions.slice().sort(function(a,b){return Number(a)-Number(b);}).forEach(function(position){
    const button=document.createElement('button');
    button.className='btn btn-secondary';
    button.textContent='QR '+position;
    button.onclick=function(){
      generatePositionQR(rack,position,item.levels);
    };
    qrButtons.appendChild(button);
  });

  qrSection.appendChild(qrButtons);
  container.appendChild(qrSection);

  document.getElementById('qrResult').innerHTML='';
  document.getElementById('detailModal').classList.add('show');

  // Muat stok seluruh rack satu kali
  loadRackStock(rack);
}




function loadRackStock(rack){
  if(rackStockLoading[rack]){
    rackStockCallbacks[rack]=true;
    return;
  }

  const item=rackDatabase.find(function(data){
    return data.rack===rack;
  });
  if(!item)return;

  const allCached=(item.locations||[]).length>0&&
    item.locations.every(function(location){
      return !!locationStockCache[location.id];
    });

  if(allCached){
    const modal=document.getElementById('detailModal');

    if(modal.classList.contains('show')&&
       document.getElementById('detailTitle').textContent===rack){
      const selected=modal.querySelector('.rack-location-cell.selected');

      if(selected){
        loadLocationDetail(selected.dataset.locationId,selected);
      }
    }
    return;
  }

  rackStockLoading[rack]=true;

  const token=localStorage.getItem('warehouseToken');

  google.script.run
    .withSuccessHandler(function(response){
      rackStockLoading[rack]=false;

      if(!response||!response.success){
        delete rackStockCallbacks[rack];
        showMessage(response&&response.message?response.message:'Gagal memuat stok rack.','error');
        return;
      }

      const fresh=response.locations||{};

      Object.keys(fresh).forEach(function(locationId){
        locationStockCache[locationId]=fresh[locationId];

        const location=(item.locations||[]).find(function(entry){
          return entry.id===locationId;
        });

        if(location){
          location.status=fresh[locationId].status||location.status||'Kosong';
        }
      });

      const modal=document.getElementById('detailModal');

      if(modal.classList.contains('show')&&
         document.getElementById('detailTitle').textContent===rack){
        modal.querySelectorAll('.rack-location-cell').forEach(function(cell){
          const data=locationStockCache[cell.dataset.locationId];
          if(!data)return;

          const status=data.status||'Kosong';

          cell.className='rack-location-cell '+getLocationStatusClass(status)+
            (cell.classList.contains('selected')?' selected':'');
          cell.querySelector('span').textContent=status;
          cell.title=cell.dataset.locationId+' • '+status;
        });

        const selected=modal.querySelector('.rack-location-cell.selected');

        if(selected){
          loadLocationDetail(selected.dataset.locationId,selected);
        }
      }

      delete rackStockCallbacks[rack];
    })
    .withFailureHandler(function(error){
      rackStockLoading[rack]=false;
      delete rackStockCallbacks[rack];
      showMessage('Gagal memuat stok rack: '+error.message,'error');
    })
    .getRackStockDetails(rack,token);
}



function getLocationStatusClass(status){
  const classes={
    'Kosong':'status-kosong',
    'Tersedia':'status-tersedia',
    'Hampir Penuh':'status-hampir-penuh',
    'Penuh':'status-penuh'
  };
  return classes[status]||'status-kosong';
}




function loadLocationDetail(locationId,cell){
  const panel=document.getElementById('locationDetailPanel');
  const cached=locationStockCache[locationId];

  if(cached){
    renderLocationDetail({
      locationId:locationId,
      rollCount:cached.rollCount,
      totalMeter:cached.totalMeter,
      totalYard:cached.totalYard,
      rolls:cached.rolls
    },cell);
    return;
  }

  panel.innerHTML='<div class="location-detail-panel">Memuat data lokasi pertama kali...</div>';

  const rackName=locationId.replace(/\s+\d{2}-[A-Z]$/,'');
  loadRackStock(rackName);
}



function renderLocationDetail(data,cell){
  const panel=document.getElementById('locationDetailPanel');
  panel.innerHTML='';

  const box=document.createElement('div');
  box.className='location-detail-panel';

  const header=document.createElement('div');
  header.className='location-detail-header';

  const titleWrap=document.createElement('div');
  const title=document.createElement('div');
  title.className='location-detail-title';
  title.textContent=data.locationId;

  const subtitle=document.createElement('div');
  subtitle.className='location-detail-subtitle';
  subtitle.textContent='Detail stok berdasarkan Location ID';

  titleWrap.appendChild(title);
  titleWrap.appendChild(subtitle);
  header.appendChild(titleWrap);
  box.appendChild(header);

  const summary=document.createElement('div');
  summary.className='location-summary';

  [
    [''+data.rollCount,'Jumlah Roll'],
    [formatLocationNumber(data.totalMeter)+' m','Total Meter'],
    [formatLocationNumber(data.totalYard)+' yd','Total Yard']
  ].forEach(function(item){
    const card=document.createElement('div');
    card.className='location-summary-box';

    const value=document.createElement('strong');
    value.textContent=item[0];

    const label=document.createElement('span');
    label.textContent=item[1];

    card.appendChild(value);
    card.appendChild(label);
    summary.appendChild(card);
  });

  box.appendChild(summary);

  const statusRow=document.createElement('div');
  statusRow.className='location-status-row';

  const statusLabel=document.createElement('label');
  statusLabel.textContent='Status lokasi:';
  statusLabel.style.fontSize='13px';
  statusLabel.style.fontWeight='bold';

  const select=document.createElement('select');
  select.id='locationStatusSelect';

  ['Kosong','Tersedia','Hampir Penuh','Penuh'].forEach(function(status){
    const option=document.createElement('option');
    option.value=status;
    option.textContent=status;
    select.appendChild(option);
  });

  const rackName=data.locationId.replace(/\s+\d{2}-[A-Z]$/,'');
  const rack=rackDatabase.find(function(item){return item.rack===rackName;});
  const location=rack&&rack.locations?rack.locations.find(function(item){
    return item.id===data.locationId;
  }):null;

  select.value=location&&location.status?location.status:'Kosong';

  const saveButton=document.createElement('button');
  saveButton.className='btn btn-primary';
  saveButton.textContent='SIMPAN STATUS';
  saveButton.onclick=function(){
    saveLocationStatus(data,select.value,cell,select,saveButton);
  };

  statusRow.appendChild(statusLabel);
  statusRow.appendChild(select);
  statusRow.appendChild(saveButton);
  box.appendChild(statusRow);

  const rollTitle=document.createElement('div');
  rollTitle.className='rack-map-title';
  rollTitle.style.marginTop='18px';
  rollTitle.textContent='Daftar Roll';
  box.appendChild(rollTitle);

  if(!data.rolls||!data.rolls.length){
    const empty=document.createElement('div');
    empty.className='location-roll-empty';
    empty.textContent='Belum ada roll tercatat di lokasi ini.';
    box.appendChild(empty);
  }else{
    const tableWrap=document.createElement('div');
    tableWrap.className='location-roll-table-wrap';

    const table=document.createElement('table');
    table.className='location-roll-table';

    const thead=document.createElement('thead');
    const headRow=document.createElement('tr');

    ['Roll ID','Produk','Warna','Grade','Status Roll','Meter'].forEach(function(label){
      const th=document.createElement('th');
      th.textContent=label;
      headRow.appendChild(th);
    });

    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody=document.createElement('tbody');

    data.rolls.forEach(function(roll){
      const row=document.createElement('tr');

      [
        roll.rollId,
        roll.product||roll.sku||'-',
        roll.color||'-',
        roll.grade||'-',
        roll.status||'-',
        formatLocationNumber(roll.meter)
      ].forEach(function(value){
        const td=document.createElement('td');
        td.textContent=value===null||value===undefined||value===''?'-':String(value);
        row.appendChild(td);
      });

      tbody.appendChild(row);
    });

    table.appendChild(tbody);
    tableWrap.appendChild(table);
    box.appendChild(tableWrap);
  }

  panel.appendChild(box);
}

function formatLocationNumber(value){
  return (Number(value)||0).toLocaleString('id-ID',{
    maximumFractionDigits:2
  });
}



function saveLocationStatus(data,status,cell,select,button){
  if(status==='Kosong'&&data.rollCount>0){
    const confirmEmpty=confirm(
      'Perhatian! Lokasi '+data.locationId+' masih memiliki '+
      data.rollCount+' roll dengan total '+formatLocationNumber(data.totalMeter)+
      ' meter.\n\nApakah kamu yakin ingin mengubah status menjadi Kosong?'
    );

    if(!confirmEmpty)return;
  }

  const token=localStorage.getItem('warehouseToken');
  const previousStatus=cell.className;
  const previousText=cell.querySelector('span').textContent;

  button.disabled=true;
  button.textContent='MENYIMPAN...';

  google.script.run
    .withSuccessHandler(function(response){
      button.disabled=false;
      button.textContent='SIMPAN STATUS';

      if(!response||!response.success){
        showMessage(response&&response.message?response.message:'Gagal menyimpan status.','error');
        return;
      }

      // Update tampilan kotak lokasi
      cell.className='rack-location-cell '+getLocationStatusClass(status)+' selected';
      cell.querySelector('span').textContent=status;
      cell.title=data.locationId+' • '+status;

      // Update status di rackDatabase
      const rackName=data.locationId.replace(/\s+\d{2}-[A-Z]$/,'');
      const rack=rackDatabase.find(function(item){
        return item.rack===rackName;
      });

      if(rack&&rack.locations){
        const location=rack.locations.find(function(item){
          return item.id===data.locationId;
        });

        if(location)location.status=status;
      }

      // Update cache agar tampilan berikutnya tetap konsisten
      if(locationStockCache[data.locationId]){
        locationStockCache[data.locationId].status=status;
      }

      // Sinkronkan pilihan status di panel detail
      if(select)select.value=status;

      showMessage(
        'Status '+data.locationId+' berhasil diubah menjadi '+status+'.',
        'success'
      );
    })
    .withFailureHandler(function(error){
      cell.className=previousStatus;
      cell.querySelector('span').textContent=previousText;

      button.disabled=false;
      button.textContent='SIMPAN STATUS';

      showMessage('Gagal menyimpan status: '+error.message,'error');
    })
    .updateLocationStatus(data.locationId,status,token);
}

function closeDetailModal(){
  document.getElementById('detailModal').classList.remove('show');
}

function generatePositionQR(rack,position,levels){
  const results=document.getElementById('qrResult');
  results.innerHTML='<div style="text-align:center;padding:15px;color:#777">Membuat QR...</div>';

  const ids=levels.map(function(level){
    return rack+' '+position+'-'+level;
  });

  results.innerHTML='';

  ids.forEach(function(locationId,index){
    generateLabel(locationId,'Rak',levels[index],index);
  });
}

async function generateLabel(locationId,type,level,index){
  const wrapper=document.createElement('div');
  wrapper.className='qr-item';

  const name=document.createElement('div');
  name.className='qr-name';
  name.textContent=locationId;

  const preview=document.createElement('div');
  preview.className='qr-preview';

  const qr=document.createElement('div');
  qr.style.display='none';
  document.body.appendChild(qr);

  new QRCode(qr,{
    text:locationId,
    width:300,
    height:300,
    correctLevel:QRCode.CorrectLevel.M
  });

  await new Promise(function(resolve){
    setTimeout(resolve,100);
  });

  const qrCanvas=qr.querySelector('canvas');

  if(!qrCanvas){
    qr.remove();
    return;
  }

  try{
    await document.fonts.load('450px "Bebas Neue"');
  }catch(e){}

  const canvas=document.createElement('canvas');
  canvas.width=2000;
  canvas.height=550;

  const ctx=canvas.getContext('2d');

  // BACKGROUND
  ctx.fillStyle='#AD2020';
  ctx.fillRect(0,0,2000,550);

  const gradient=ctx.createLinearGradient(0,0,0,550);
  gradient.addColorStop(0.25,'rgba(0,0,0,0)');
  gradient.addColorStop(1,'rgba(0,0,0,0.25)');
  ctx.fillStyle=gradient;
  ctx.fillRect(0,0,2000,550);

  // BOX RAK
  roundRect(ctx,49,125,172,120,10,'#fff');

  // RAK VECTOR
  drawRak(ctx);

  // LOCATION ID
  const displayId=locationId
    .replace(/^RACK\s*/i,'')
    .replace(/\s+/g,'')
    .replace(/^([A-Z])(\d)/,'$1 $2');

  ctx.fillStyle='#fff';
  ctx.font='450px "Bebas Neue",sans-serif';
  ctx.textAlign='left';
  ctx.textBaseline='alphabetic';
  ctx.fillText(displayId,226.4,435);

  // BOX QR
  roundRect(ctx,1284.53,50,665.47,450,50,'#fff');

  // ARROW
  drawArrow(ctx,String(level||'').toUpperCase()==='A'?'down':'up');

  // QR
  ctx.drawImage(qrCanvas,1504,104,342,342);

  preview.appendChild(canvas);

  const button=document.createElement('button');
  button.className='btn btn-download';
  button.textContent='⬇ DOWNLOAD '+displayId;

  button.onclick=function(){
    const link=document.createElement('a');
    link.download=displayId.replace(/[^a-zA-Z0-9_-]/g,'_')+'.png';
    link.href=canvas.toDataURL('image/png');
    link.click();
  };

  wrapper.appendChild(preview);
  wrapper.appendChild(name);
  wrapper.appendChild(button);

  document.getElementById('qrResult').appendChild(wrapper);

  qr.remove();
}

function roundRect(ctx,x,y,w,h,r,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
  ctx.fill();
}

function drawRak(ctx){
  ctx.fillStyle='#993333';
  ctx.font='450 100px "Bebas Neue",sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('RAK',135,193);
}

function drawArrow(ctx,direction){
  const path=direction==='down'
    ?new Path2D('M1382.26 330V120H1402.26V330H1450L1392.26 430L1334.53 330H1382.26Z')
    :new Path2D('M1402.26 220L1402.26 430L1382.26 430L1382.26 220L1334.53 220L1392.26 120L1450 220L1402.26 220Z');

  ctx.fillStyle='#993333';
  ctx.fill(path);
}

function showMessage(message,type){
  const box=document.getElementById('message');
  box.textContent=message;
  box.className=type;
  box.style.display='block';

  setTimeout(function(){
    box.style.display='none';
  },5000);
}

function escapeHtml(value){
  return String(value||'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}
