<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      background:#e5e5e5;
      font-family:Arial,sans-serif;
      color:#222;
    }

    .toolbar{
      padding:15px;
      background:white;
      border-bottom:1px solid #ddd;
      display:flex;
      justify-content:center;
      gap:8px;
      position:sticky;
      top:0;
      z-index:10;
    }

    .toolbar button{
      border:0;
      border-radius:7px;
      padding:10px 18px;
      font-size:14px;
      font-weight:bold;
      cursor:pointer;
    }

    .print-btn{
      background:#198754;
      color:white;
    }

    .close-btn{
      background:#eee;
      color:#222;
    }

    .page{
      width:148mm;
      min-height:210mm;
      margin:20px auto;
      padding:8mm;
      background:white;
      box-shadow:0 2px 10px rgba(0,0,0,.15);
    }

    .header{
      text-align:center;
      margin-bottom:5mm;
    }

    .company{
      font-size:11px;
      font-weight:bold;
      letter-spacing:1.5px;
    }

    .title{
      font-size:16px;
      font-weight:bold;
      margin-top:1mm;
    }

    .rack-name{
      font-size:25px;
      font-weight:bold;
      margin-top:1mm;
    }

    .subtitle{
      font-size:9px;
      color:#777;
      margin-top:1mm;
    }

    .grid{
      display:grid;
      border-top:1px solid #222;
      border-left:1px solid #222;
    }

    .cell{
      border-right:1px solid #222;
      border-bottom:1px solid #222;
    }

    .header-cell{
      min-height:9mm;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:11px;
      font-weight:bold;
      background:#f5f5f5;
    }

    .position-cell{
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:11px;
      font-weight:bold;
    }

    .qr-cell{
      min-height:34mm;
      padding:2mm 1mm;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:1mm;
    }

    .qr{
      width:25mm;
      height:25mm;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .qr img,
    .qr canvas{
      width:25mm!important;
      height:25mm!important;
    }

    .location-id{
      font-size:7px;
      font-weight:bold;
      white-space:nowrap;
      text-align:center;
    }

    .empty-cell{
      min-height:34mm;
    }

    .footer{
      text-align:center;
      margin-top:5mm;
      font-size:8px;
      color:#888;
    }

    .loading{
      text-align:center;
      padding:50px 20px;
      color:#777;
    }

    @media print{
      @page{
        size:A5 portrait;
        margin:0;
      }

      html,body{
        width:148mm;
        height:210mm;
        background:white;
      }

      .toolbar{
        display:none!important;
      }

      .page{
        width:148mm;
        height:210mm;
        min-height:210mm;
        margin:0;
        padding:8mm;
        box-shadow:none;
      }
    }
  </style>
</head>

<body>

<div class="toolbar">
  <button class="print-btn" onclick="printPage()">🖨️ PRINT A5</button>
  <button class="close-btn" onclick="window.close()">TUTUP</button>
</div>

<div id="content">
  <div class="loading">Membuat QR Location...</div>
</div>

<script>
let rackData=null;

function printPage(){
  window.print();
}

function getData(){
  const params=new URLSearchParams(window.location.search);
  const encoded=params.get('data');

  if(!encoded){
    showError('Data Rack tidak ditemukan.');
    return;
  }

  try{
    rackData=JSON.parse(decodeURIComponent(encoded));

    if(!rackData.rack){
      showError('Nama Rack tidak ditemukan.');
      return;
    }

    renderPage();
  }catch(error){
    showError('Data Rack tidak valid.');
  }
}

function renderPage(){
  const rack=rackData.rack;
  const positions=rackData.positions||[];
  const levels=rackData.levels||[];

  if(!positions.length||!levels.length){
    showError('Rack belum memiliki Position atau Level.');
    return;
  }

  const sortedPositions=positions.slice().sort(function(a,b){
    return Number(a)-Number(b);
  });

  const sortedLevels=levels.slice().sort();

  const columnCount=sortedLevels.length+1;

  let html=
    '<div class="page">'+
      '<div class="header">'+
        '<div class="company">PADAJAYA PELITA</div>'+
        '<div class="title">LOCATION MAP</div>'+
        '<div class="rack-name">'+escapeHtml(rack)+'</div>'+
        '<div class="subtitle">Scan QR sesuai posisi penyimpanan</div>'+
      '</div>'+
      '<div class="grid" style="grid-template-columns:12mm repeat('+sortedLevels.length+',1fr)">';

  html+='<div class="cell header-cell">POS</div>';

  sortedLevels.forEach(function(level){
    html+=
      '<div class="cell header-cell">'+
        escapeHtml(level)+
      '</div>';
  });

  sortedPositions.forEach(function(position){
    html+=
      '<div class="cell position-cell">'+
        escapeHtml(position)+
      '</div>';

    sortedLevels.forEach(function(level){
      const locationId=rack+' '+position+'-'+level;

      html+=
        '<div class="cell qr-cell">'+
          '<div class="qr" id="'+
            getQrId(position,level)+
          '"></div>'+
          '<div class="location-id">'+
            escapeHtml(locationId)+
          '</div>'+
        '</div>';
    });
  });

  html+=
      '</div>'+
      '<div class="footer">'+
        'PADAJAYA PELITA • LOCATION QR MAP'+
      '</div>'+
    '</div>';

  document.getElementById('content').innerHTML=html;

  generateQRs(rack,sortedPositions,sortedLevels);
}

function generateQRs(rack,positions,levels){
  positions.forEach(function(position){
    levels.forEach(function(level){
      const locationId=rack+' '+position+'-'+level;
      const qr=document.getElementById(getQrId(position,level));

      if(!qr)return;

      new QRCode(qr,{
        text:locationId,
        width:220,
        height:220,
        correctLevel:QRCode.CorrectLevel.M
      });
    });
  });
}

function getQrId(position,level){
  return 'qr-'+
    String(position).replace(/[^a-zA-Z0-9_-]/g,'_')+
    '-'+
    String(level).replace(/[^a-zA-Z0-9_-]/g,'_');
}

function showError(message){
  document.getElementById('content').innerHTML=
    '<div class="loading">'+
      escapeHtml(message)+
    '</div>';
}

function escapeHtml(value){
  return String(value||'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function loadRack(){
  const params=new URLSearchParams(window.location.search);
  const rack=params.get('rack');

  if(!rack){
    showError('Rack tidak ditemukan.');
    return;
  }

  google.script.run
    .withSuccessHandler(function(response){
      if(!response||!response.success){
        showError(response&&response.message?response.message:'Gagal mengambil data Rack.');
        return;
      }

      const item=response.racks.find(function(data){
        return data.rack===rack;
      });

      if(!item){
        showError('Rack "'+rack+'" tidak ditemukan.');
        return;
      }

      rackData={
        rack:item.rack,
        positions:item.positions,
        levels:item.levels
      };

      renderPage();
    })
    .withFailureHandler(function(error){
      showError('Gagal mengambil data Rack: '+error.message);
    })
    .getRackMaster();
}

loadRack();

// getData();
</script>

</body>
</html>
